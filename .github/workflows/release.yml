name: Release Sentinel Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 📱 Build & Publish Sentinel Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine Release Version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_VERSION"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG_NAME" ]; then TAG_NAME="v0.0.1"; fi
          echo "Determined Release Version: $TAG_NAME"
          echo "RELEASE_TAG=${TAG_NAME}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK (Release)
        run: ./gradlew assembleFossRelease --stacktrace

      - name: Sign and Package APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          RAW_APK=$(find app/build/outputs/apk/foss/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi
          echo "Found compiled APK: $RAW_APK"
          
          OUT_APK="release-artifacts/Sentinel-Android-${RELEASE_TAG}.apk"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "==> Signing with secret keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            $BUILD_TOOLS/apksigner sign --ks release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$OUT_APK" "$RAW_APK"
          else
            echo "==> Signing with auto-generated release keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias sentinel -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Sentinel, OU=Mobile, O=Sentinel, L=City, S=State, C=US"
            $BUILD_TOOLS/apksigner sign --ks release.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUT_APK" "$RAW_APK"
          fi

          echo "==> Verifying signature..."
          $BUILD_TOOLS/apksigner verify --verbose "$OUT_APK"

          echo "==> Computing SHA256 checksum..."
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sentinel Mobile ${{ env.RELEASE_TAG }}
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
